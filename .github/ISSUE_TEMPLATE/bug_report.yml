name: Bug report
description: Something in a FederAstro tool doesn't work as it should.
labels: ["bug"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - Palette Lab
        - Mask Lab
        - Finderscope
        - Acquisition Card
    validations:
      required: true
  - type: input
    id: tool-version
    attributes:
      label: Tool version
      description: Shown in the tool's window or in Process ▸ Modules ▸ Manage Modules.
      placeholder: "e.g. 0.1.0"
    validations:
      required: true
  - type: input
    id: pi-version
    attributes:
      label: PixInsight version
      placeholder: "e.g. 1.9.5"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
  - type: textarea
    id: console
    attributes:
      label: Process Console output
      description: Copy any errors or warnings from PixInsight's Process Console (View ▸ Process Console).
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if they help.
